# Model files `python aegis.py models get` can download, pinned by size and SHA-256.
#
# Each profile's tiers name one of these with `download = "<id>"`. Every file was checked on
# Hugging Face on 2026-11-20: not gated, licensed as shown, with the size and hash below. The
# downloader refuses a file whose hash doesn't match, so a changed or tampered upload is caught.
#
# `measured` points at evidence where the file was run with this harness. Entries without it fit
# their profile's size class and quantization, but nobody has reported results for them yet.
#
# To add a model: pick a GGUF from the model maker or a well-known repackager, check its license
# and that the repository isn't gated, copy the file's size and SHA-256 from its Hugging Face file
# page, and add an entry. `tests/test_models.py` checks the shape of every entry.

