# Aegis-Local hardware profile: nvidia-12gb
# Size classes are the stable part of this file. Model names under "candidates" are suggestions
# to verify (availability, license, results) before use. Set "model" to the path of your GGUF
# file, or set AEGIS_TIER0_MODEL / AEGIS_TIER1_MODEL in .env.

[profile]
name = "nvidia-12gb"
vendor = "nvidia"
vram_gb = 12
description = "GeForce RTX 3060 12 GB, 4070, 5070, and similar."
placement = "Tier 1 on GPU, tier 0 in system RAM."
tested = false

[backend]
windows = "cuda"
linux = "cuda"

[tiers.tier0]
role = "extractor"
size_class = "4B dense"
quant = "Q8_0"
candidates = ["Qwen3.5-4B"]
model = ""
ctx = 16384
gpu_layers = 0
port = 8080
extra_args = ["--jinja", "--reasoning-budget", "0"]

[tiers.tier1]
role = "reasoner"
size_class = "9-14B dense"
quant = "Q6_K"
candidates = ["Qwen3.5-9B Q6_K", "Qwen2.5-Coder-14B Q4_K_M"]
model = ""
ctx = 32768
gpu_layers = 99
port = 8081
extra_args = ["--jinja", "--cache-type-k", "q8_0", "--cache-type-v", "q8_0"]

[measured]
# Filled in by whoever tests this profile. See docs/MODEL-LOADOUTS.md.
# 2026-11-17, RTX 4070 12 GB, i9-9900K, Windows 11, llama.cpp b12361 CUDA, at the ctx above.
# tier1: Qwen3.5-9B-Q6_K.gguf (lmstudio-community, the first candidate); about 860 tokens/s on prompts.
# tier0: Qwen3-4B-Q4_K_M.gguf on the CPU, not the Q8_0 candidate; about 21 tokens/s on prompts.
# peak_vram_gb is the whole card during the eval, including the Windows desktop (tier 1 alone: about 7.3).
# Eval results: docs/validation/12gb-tier1-2026-11-17-windows11-rtx4070/. Still tested = false until a
# second person reproduces them.
tier0_tokens_per_second = 8.3
tier1_tokens_per_second = 50.7
peak_vram_gb = 8.8
