# Aegis-Local hardware profile: nvidia-8gb
# Size classes are the stable part of this file. Model names under "candidates" are suggestions
# to verify (availability, license, results) before use. Set "model" to the path of your GGUF
# file, or set AEGIS_TIER0_MODEL / AEGIS_TIER1_MODEL in .env.

[profile]
name = "nvidia-8gb"
vendor = "nvidia"
vram_gb = 8
description = "GeForce RTX 3060 Ti, 4060, and similar."
placement = "Tier 1 on GPU, tier 0 in system RAM."
tested = false

[backend]
windows = "cuda"
linux = "cuda"

[tiers.tier0]
role = "extractor"
size_class = "1-4B dense"
quant = "Q6_K"
candidates = ["Qwen3.5-4B"]
download = "qwen3.5-4b-q6_k"
model = ""
ctx = 16384
gpu_layers = 0
port = 8080
extra_args = ["--jinja", "--reasoning-budget", "0"]

[tiers.tier1]
role = "reasoner"
size_class = "7-9B dense"
quant = "Q4_K_M"
candidates = ["Qwen3.5-9B"]
download = "qwen3.5-9b-q4_k_m"
model = ""
ctx = 16384
gpu_layers = 99
port = 8081
extra_args = ["--jinja", "--cache-type-k", "q8_0", "--cache-type-v", "q8_0"]

[measured]
# Filled in by whoever tests this profile. See docs/MODEL-LOADOUTS.md.
# 2026-11-27, on an RTX 4070 12 GB (not an 8 GB card), i9-9900K, Windows 11, llama.cpp b12361 CUDA,
# with the download files above at the ctx above.
# tier1: Qwen3.5-9B-Q4_K_M.gguf on the GPU; about 520 tokens/s on prompts.
# tier0: Qwen3.5-4B-Q6_K.gguf on the CPU; about 13 tokens/s on prompts.
# peak_vram_gb is the two tiers alone (peak minus the desktop's own use), which leaves about 1.9 GB
# of an 8 GB card for the desktop. Eval results (17/18 fixed): docs/validation/8gb-and-cpu-2026-11-27-windows11-rtx4070/.
# Still tested = false until a second person reproduces them, on an 8 GB card.
tier0_tokens_per_second = 5.0
tier1_tokens_per_second = 49.3
peak_vram_gb = 6.1
