# Aegis-Local hardware profile: cpu-only
# Size classes are the stable part of this file. Model names under "candidates" are suggestions
# to verify (availability, license, results) before use. Set "model" to the path of your GGUF
# file, or set AEGIS_TIER0_MODEL / AEGIS_TIER1_MODEL in .env.

[profile]
name = "cpu-only"
vendor = "cpu"
vram_gb = 0
description = "No GPU. Slow but functional; used for CI and evaluation."
placement = "Both tiers in system RAM."
tested = false

[backend]
windows = "cpu"
linux = "cpu"

[tiers.tier0]
role = "extractor"
size_class = "1-4B dense"
quant = "Q4_K_M"
candidates = ["Qwen3.5-4B"]
download = "qwen3.5-4b-q4_k_m"
model = ""
ctx = 16384
gpu_layers = 0
port = 8080
extra_args = ["--jinja", "--reasoning-budget", "0"]

[tiers.tier1]
role = "reasoner"
size_class = "7-9B dense"
quant = "Q4_K_M"
candidates = ["Qwen3.5-9B"]
download = "qwen3.5-9b-q4_k_m"
model = ""
ctx = 16384
gpu_layers = 0
port = 8081
extra_args = ["--jinja", "--cache-type-k", "q8_0", "--cache-type-v", "q8_0"]

[measured]
# Filled in by whoever tests this profile. See docs/MODEL-LOADOUTS.md.
# 2026-11-27, i9-9900K (8 cores), 32 GB RAM, Windows 11, llama.cpp b12361 with the GPU hidden
# (CUDA_VISIBLE_DEVICES=-1), with the download files above at the ctx above.
# tier1: Qwen3.5-9B-Q4_K_M.gguf; about 25 tokens/s on prompts.
# tier0: Qwen3.5-4B-Q4_K_M.gguf; about 19 tokens/s on prompts.
# Eval results (12/12 fixed, a median of 267 s per run): docs/validation/8gb-and-cpu-2026-11-27-windows11-rtx4070/.
# Still tested = false until a second person reproduces them.
tier0_tokens_per_second = 7.2
tier1_tokens_per_second = 4.3
peak_vram_gb = 0
