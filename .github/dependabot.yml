version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directories:
      - /
      - /services/model-router
      - /services/mcp-guard-proxy
      - /services/sandboxes/code-worker
      - /services/sandboxes/math-physics-mcp
      - /services/sandboxes/writing-auditor
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /services/model-router
      - /services/mcp-guard-proxy
      - /services/sandboxes/code-worker
      - /services/sandboxes/math-physics-mcp
      - /services/sandboxes/writing-auditor
    schedule:
      interval: weekly
