name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems (sandbox escapes, approval bypasses, exposed ports) should be reported
        privately. See SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. python aegis.py up --profile ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Host OS
      options: [Windows 11, Linux, Other]
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Container runtime
      options: [Docker Desktop, Podman Desktop, Docker Engine, Podman (rootful), Podman (rootless), Other]
    validations:
      required: true
  - type: input
    id: profile
    attributes:
      label: Profile and GPU
      placeholder: nvidia-12gb on RTX 4070
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `python aegis.py doctor` and any relevant service logs. Remove tokens first.
      render: text
