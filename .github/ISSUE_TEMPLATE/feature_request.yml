name: Feature or design proposal
description: Suggest a new capability or a change to the design.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What failure mode or workflow gap does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you build, and where would it live (router, guard, sandbox, launcher, OpenCode config)?
    validations:
      required: true
  - type: textarea
    id: trust
    attributes:
      label: Effect on the trust boundary
      description: Does this add a decision to the control plane? Could it ever let a model decide something deterministic code decides today?
  - type: checkboxes
    id: willing
    attributes:
      label: Contribution
      options:
        - label: I'd like to work on this myself.
